<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#3a4234;--mut:#8a9282;--m:#9db487;--m2:#d3e0c3;--m3:#e8efdd;--act:#6f8a5c;--onact:#fff;--rose:#eccbc4;--line:#e6e1d4;--sh:0 8px 24px rgba(80,95,60,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d2119;--card:#262b21;--ink:#ecefe4;--mut:#9aa391;--m:#9db487;--m2:#3d4b32;--m3:#313a29;--act:#9db487;--onact:#1d2119;--rose:#5a4440;--line:#394032;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d2119;--card:#262b21;--ink:#ecefe4;--mut:#9aa391;--m:#9db487;--m2:#3d4b32;--m3:#313a29;--act:#9db487;--onact:#1d2119;--rose:#5a4440;--line:#394032;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{font:600 24px Fraunces,Georgia,serif;padding:0 12px 18px;outline:none}.brand small{display:block;font:12px Inter,sans-serif;color:var(--mut)}
.nv{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;border:0;background:none;color:var(--ink);cursor:pointer;width:100%;text-align:left;font:inherit}
.nv:hover{background:var(--m3)}.nv.on{background:var(--act);color:var(--onact);font-weight:600}
main{padding:28px 32px 60px;max-width:1200px;width:100%}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}.hd h2{font-size:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}.card h3{font-size:18px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{border-radius:20px;padding:16px;background:var(--m3)}.stat:nth-child(2){background:var(--rose)}.stat:nth-child(3){background:var(--m2)}.stat span{font-size:13px;color:var(--mut);display:block}.stat b{font:600 26px Fraunces,Georgia,serif}
.hero{background:linear-gradient(135deg,var(--m2),var(--rose));border:0;margin-bottom:18px}.hero h2{font-size:28px}.hero p{margin:4px 0 0;color:var(--mut)}
.btn{background:var(--act);color:var(--onact);border:0;border-radius:14px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:600}
.ghost{background:var(--m3);color:var(--ink);border:0;border-radius:14px;padding:9px 16px;cursor:pointer;font:inherit}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;padding:4px 8px;border-radius:8px}.x.sure{background:var(--rose);color:var(--ink)}
.pb{height:10px;background:var(--m3);border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--m),var(--act));border-radius:9px}
.mut,small{color:var(--mut)}.row{display:flex;gap:10px;justify-content:flex-end;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li .g{flex:1}.done{text-decoration:line-through;color:var(--mut)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 12px}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--act)}input[type=range]{padding:0;margin:6px 0;accent-color:var(--act)}
label{display:block;font-size:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(40,50,35,.45);display:grid;place-items:center;z-index:50;padding:16px}.box{background:var(--card);color:var(--ink);border-radius:24px;padding:22px;width:min(420px,100%);max-height:90vh;overflow:auto}.box h3{margin-bottom:14px}
.dots{display:flex;gap:8px}.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--m2);background:none;cursor:pointer;padding:0}.dot.on{background:var(--act);border-color:var(--act)}
.dl{display:flex;gap:8px;font-size:11px;color:var(--mut)}.dl span{width:30px;text-align:center}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:var(--m3)}.chip.Alta{background:var(--rose)}.chip.Baixa{background:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal b{text-align:center;font-size:12px;color:var(--mut)}
.day{min-height:84px;background:var(--bg);border-radius:12px;padding:6px;font-size:12px;cursor:pointer;overflow:hidden}.day.t{outline:2px solid var(--act)}.day.o{opacity:.3;cursor:default}
.ev{display:block;background:var(--m2);border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;align-items:start}.kan .card .card{margin-bottom:12px;background:var(--bg);box-shadow:none}
.mas{columns:260px;column-gap:18px}.mas .card{break-inside:avoid;margin-bottom:18px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.bk{aspect-ratio:2/3;width:100%;border-radius:12px;object-fit:cover;display:block;cursor:pointer;box-shadow:var(--sh)}.ph{background:linear-gradient(160deg,var(--m2),var(--rose));display:grid;place-items:center;padding:10px;text-align:center;font:600 15px Fraunces,Georgia,serif}
.st span{cursor:pointer;color:#d9b95e;font-size:19px}.st span.off{color:var(--line)}
.leg{display:flex;flex-direction:column;gap:3px;font-size:13px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.neg{color:#c0675a}.pos{color:var(--act)}svg text{fill:var(--mut);font-size:9px}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px}.brand{display:none}.nv{width:auto;white-space:nowrap}main{padding:16px}}
</style></head>

let S=defS(),covers={},dbRef=null,dbReady=false,view='home',pd='',fm={y:new Date().getFullYear(),m:new Date().getMonth()},cm={...fm};
try{S=Object.assign(defS(),JSON.parse(localStorage.getItem('painel')||'{}'))}catch(x){}
let tm;function save(){try{localStorage.setItem('painel',JSON.stringify(S))}catch(x){}clearTimeout(tm);tm=setTimeout(()=>{if(dbRef&&dbReady)dbRef.doc('app').set({json:JSON.stringify(S)}).catch(()=>{})},500)}
function cover(id){if(covers[id]===undefined){try{covers[id]=localStorage.getItem('cv_'+id)||''}catch(x){covers[id]=''}}return covers[id]}
function setCover(id,img){if(!img)return;covers[id]=img;try{localStorage.setItem('cv_'+id,img)}catch(x){}if(dbRef&&dbReady)dbRef.doc('cover_'+id).set({img}).catch(()=>{})}
(async()=>{try{const c=window.claude;if(!c)return;const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;dbRef=db.collection('data/users/'+id);
const all=await dbRef.get();all.docs.forEach(d=>{const v=d.data()||{};if(d.id==='app'&&v.json){S=Object.assign(defS(),JSON.parse(v.json));try{localStorage.setItem('painel',JSON.stringify(S))}catch(x){}}else if(d.id.startsWith('cover_')&&v.img)covers[d.id.slice(6)]=v.img});
dbReady=true;render();save();all.docs.forEach(d=>{})}catch(x){dbRef=null}})();
const sum=(l,t)=>l.filter(x=>x.type==t).reduce((a,x)=>a+x.val,0),pct=g=>g.target?Math.min(100,Math.round(g.current/g.target*100)):0;
const l7=()=>{const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d)}return a};
const streak=h=>{const d=new Date();if(!h.log[ymd(d)])d.setDate(d.getDate()-1);let n=0;while(h.log[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n};
const dx=(k,id)=>`<button class="x ${pd==k+id?'sure':''}" onclick="A.del('${k}','${id}')">${pd==k+id?'Apagar?':'✕'}</button>`;
const head=(t,k,l)=>`<div class="hd"><h2>${t}</h2>${k?`<button class="btn" onclick="A.add('${k}')">+ ${l}</button>`:''}</div>`;
const em=t=>`<p class="mut">${t}</p>`,card=(t,b,c='')=>`<section class="card ${c}"><h3>${t}</h3>${b}</section>`;
const stars=(n,f)=>`<div class="st">${[1,2,3,4,5].map(i=>`<span class="${i<=n?'':'off'}" onclick="${f(i)}">★</span>`).join('')}</div>`;
const bar=p=>`<div class="pb"><i style="width:${p}%"></i></div>`;
function donut(it){const tot=it.reduce((a,b)=>a+b.v,0);if(!tot)return em('Sem despesas neste mês.');const R=40,C=2*Math.PI*R;let o=0;
return `<div class="between" style="align-items:center"><svg viewBox="0 0 120 120" width="130"><g transform="rotate(-90 60 60)">${it.map((x,i)=>{const l=x.v/tot*C,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COL[i%7]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</g></svg><div class="leg">${it.map((x,i)=>`<span><i style="background:${COL[i%7]}"></i>${e(x.n)} · ${money(x.v)}</span>`).join('')}</div></div>`}
function bars(cols,max){return `<svg viewBox="0 0 ${cols.length*44} 110">${cols.map((c,i)=>{const x=i*44+6;return c.v.map((v,j)=>{const h=max?Math.round(v/max*80):0;return `<rect x="${x+j*15}" y="${88-h}" width="13" height="${h}" rx="4" fill="${c.c[j]}"/>`}).join('')+`<text x="${x+14}" y="102" text-anchor="middle">${c.l}</text>`}).join('')}</svg>`}
function form(title,F,cb,init={}){const m=document.createElement('div');m.className='modal';
m.innerHTML=`<div class="box"><h3>${e(title)}</h3>${F.map(f=>{const v=init[f.k]??(f.d=='today'?today():f.d??'');return `<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${v==o?'selected':''}>${e(o)}</option>`).join('')}</select>`:f.t=='textarea'?`<textarea name="${f.k}" rows="3">${e(v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any"':''} ${f.t=='file'?'accept="image/*"':`value="${e(v)}"`}>`}</label>`}).join('')}<div class="row"><button class="ghost" data-x>Cancelar</button><button class="btn" data-ok>Salvar</button></div></div>`;
document.body.appendChild(m);m.querySelector('[data-x]').onclick=()=>m.remove();
m.querySelector('[data-ok]').onclick=async()=>{const o={};m.querySelectorAll('[name]').forEach(el=>o[el.name]=el.type=='file'?el.files[0]:el.value);if(await cb(o)!==false)m.remove()};
const f1=m.querySelector('input,textarea');if(f1)f1.focus()}
const rs=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=240;c.height=360;const s=Math.max(240/i.width,360/i.height),w=i.width*s,h=i.height*s;c.getContext('2d').drawImage(i,(240-w)/2,(360-h)/2,w,h);r(c.toDataURL('image/jpeg',.78))};i.onerror=()=>r(null);i.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
const SCH={
goals:[{k:'title',l:'Meta',r:1},{k:'current',l:'Valor atual',t:'number',d:0},{k:'target',l:'Valor alvo',t:'number',d:100,r:1},{k:'unit',l:'Unidade (R$, livros, kg…)'}],
tasks:[{k:'title',l:'Tarefa',r:1},{k:'due',l:'Prazo (opcional)',t:'date'}],
habits:[{k:'name',l:'Hábito',r:1}],
tx:[{k:'type',l:'Tipo',t:'select',o:['Despesa','Receita']},{k:'desc',l:'Descrição',r:1},{k:'cat',l:'Categoria',t:'select',o:CATS},{k:'val',l:'Valor (R$)',t:'number',r:1},{k:'date',l:'Data',t:'date',d:'today'}],
wish:[{k:'name',l:'Item',r:1},{k:'price',l:'Preço (R$)',t:'number',d:0},{k:'pri',l:'Prioridade',t:'select',o:['Alta','Média','Baixa']},{k:'st',l:'Status',t:'select',o:['Quero','Pesquisando','Comprado']}],
proj:[{k:'name',l:'Projeto',r:1},{k:'desc',l:'Descrição',t:'textarea'},{k:'st',l:'Fase',t:'select',o:PH},{k:'pg',l:'Progresso (%)',t:'number',d:0}],
ev:[{k:'title',l:'Evento',r:1},{k:'date',l:'Data',t:'date',d:'today',r:1},{k:'time',l:'Hora',t:'time'}],
mom:[{k:'title',l:'Título',r:1},{k:'date',l:'Data',t:'date',d:'today'},{k:'mood',l:'Clima',t:'select',o:MOODS},{k:'text',l:'O que aconteceu?',t:'textarea'}],
books:[{k:'title',l:'Nome do livro',r:1},{k:'author',l:'Autor(a)'},{k:'stars',l:'Estrelas',t:'select',o:['5','4','3','2','1','0']},{k:'cover',l:'Capa (envie uma imagem)',t:'file'}]};
const TT={goals:'Meta',tasks:'Tarefa',habits:'Hábito',tx:'Lançamento',wish:'Wishlist',proj:'Projeto',ev:'Evento',mom:'Momento',books:'Livro'};
async function sv(k,it,o,isNew){const F=SCH[k];for(const f of F)if(f.r&&!String(o[f.k]??'').trim())return false;
for(const f of F){if(f.t=='file')continue;it[f.k]=f.t=='number'?(+o[f.k]||0):o[f.k]}
if(isNew){if(k=='habits')it.log={};if(k=='tasks')it.done=false}
if(k=='books'){it.stars=+it.stars;if(o.cover)setCover(it.id,await rs(o.cover))}
if(isNew)S[k].push(it);save();render()}
const A={add:(k,pre={})=>form('Novo · '+TT[k],SCH[k],o=>sv(k,{id:uid()},o,true),pre),
edit:(k,id)=>{const it=S[k].find(x=>x.id==id);form('Editar · '+TT[k],SCH[k],o=>sv(k,it,o,false),it)},
del:(k,id)=>{const key=k+id;if(pd!=key){pd=key;setTimeout(()=>{if(pd==key){pd='';render()}},2500);render();return}pd='';S[k]=S[k].filter(x=>x.id!=id);if(k=='books')try{localStorage.removeItem('cv_'+id);if(dbRef)dbRef.doc('cover_'+id).delete().catch(()=>{})}catch(x){}save();render()},
tk:id=>{const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();render()},
tg:(id,d)=>{const h=S.habits.find(x=>x.id==id);h.log[d]?delete h.log[d]:h.log[d]=1;save();render()},
gs:(id,v)=>{S.goals.find(x=>x.id==id).current=+v||0;save();render()},
ws:(id,v)=>{S.wish.find(x=>x.id==id).st=v;save();render()},
ps:(id,v)=>{S.proj.find(x=>x.id==id).st=v;save();render()},
pp:(id,v)=>{S.proj.find(x=>x.id==id).pg=+v;save()},
bs:(id,n)=>{const b=S.books.find(x=>x.id==id);b.stars=b.stars==n?0:n;save();render()},
mv:(o,d)=>{o.m+=d;if(o.m<0){o.m=11;o.y--}if(o.m>11){o.m=0;o.y++}render()}};
const V={};
V.home=()=>{const t=today(),L=l7().map(ymd),pend=S.tasks.filter(x=>!x.done),H=S.habits,hp=H.length?Math.round(H.reduce((a,h)=>a+L.filter(d=>h.log[d]).length,0)/(H.length*7)*100):0;
const mt=S.tx.filter(x=>x.date.startsWith(t.slice(0,7))),inc=sum(mt,'Receita'),exp=sum(mt,'Despesa'),gp=S.goals.length?Math.round(S.goals.reduce((a,g)=>a+pct(g),0)/S.goals.length):0;
const hr=new Date().getHours(),gr=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite',ev=S.ev.filter(x=>x.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4),mo=[...S.mom].sort((a,b)=>b.date.localeCompare(a.date))[0];
const hb=bars(L.map((d,i)=>({l:DS[l7()[i].getDay()],v:[H.length?H.filter(h=>h.log[d]).length/H.length:0],c:['var(--act)']})),1);
return `<div class="card hero"><h2>${gr} 🌿</h2><p>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · aqui está o resumo da sua semana</p></div>
<div class="stats"><div class="stat"><span>Tarefas pendentes</span><b>${pend.length}</b></div><div class="stat"><span>Hábitos (7 dias)</span><b>${hp}%</b></div><div class="stat"><span>Metas (média)</span><b>${gp}%</b></div><div class="stat"><span>Saldo do mês</span><b style="font-size:20px">${money(inc-exp)}</b></div></div>
<div class="grid">${card('Para fazer',pend.slice(0,5).map(x=>`<div class="li"><input type="checkbox" onchange="A.tk('${x.id}')"><span class="g">${e(x.title)}</span></div>`).join('')||em('Nada pendente. 🎉'))}
${card('Hábitos na semana',H.length?hb:em('Cadastre hábitos para acompanhar.'))}
${card('Próximos eventos',ev.map(x=>`<div class="li"><span class="g">${e(x.title)}</span><small>${x.date.split('-').reverse().slice(0,2).join('/')} ${e(x.time)}</small></div>`).join('')||em('Sem eventos à vista.'))}
${card('Metas',S.goals.slice(0,4).map(g=>`<div><div class="between"><span>${e(g.title)}</span><small>${pct(g)}%</small></div>${bar(pct(g))}</div>`).join('')||em('Crie sua primeira meta.'))}
${card('Finanças do mês',`<div class="between"><span>Receitas</span><b class="pos">${money(inc)}</b></div><div class="between"><span>Despesas</span><b class="neg">${money(exp)}</b></div>`)}
${card('Último momento',mo?`<div style="font-size:28px">${e(mo.mood)}</div><b>${e(mo.title)}</b><p class="mut">${e(mo.text).slice(0,140)}</p>`:em('Registre um momento especial.'))}
${S.books.length?card('Leituras',`<div class="books" style="grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px">${S.books.slice(-4).map(b=>cover(b.id)?`<img class="bk" src="${cover(b.id)}" alt="">`:`<div class="bk ph" style="font-size:10px">${e(b.title)}</div>`).join('')}</div>`):''}</div>`};
V.goals=()=>head('Metas pessoais','goals','Nova meta')+`<div class="grid">${S.goals.map(g=>card(e(g.title),`${bar(pct(g))}<div class="between"><small>${pct(g)}% concluído</small><small>alvo: ${g.target} ${e(g.unit)}</small></div><label style="margin-top:10px">Valor atual (${e(g.unit)})<input type="number" step="any" value="${g.current}" onchange="A.gs('${g.id}',this.value)"></label><div class="row"><button class="ghost" onclick="A.edit('goals','${g.id}')">Editar</button>${dx('goals',g.id)}</div>`)).join('')||em('Nenhuma meta ainda. Comece com algo que te anima!')}</div>`;
V.tasks=()=>{const r=(x)=>`<div class="li"><input type="checkbox" ${x.done?'checked':''} onchange="A.tk('${x.id}')"><span class="g ${x.done?'done':''}">${e(x.title)}</span>${x.due?`<small>${x.due.split('-').reverse().join('/')}</small>`:''}${dx('tasks',x.id)}</div>`;
return head('Tarefas','tasks','Nova tarefa')+card('A fazer',S.tasks.filter(x=>!x.done).map(r).join('')||em('Tudo em dia! 🌿'))+'<div style="height:18px"></div>'+card('Concluídas',S.tasks.filter(x=>x.done).map(r).join('')||em('—'))};
V.habits=()=>{const L=l7();return head('Hábitos','habits','Novo hábito')+card('Últimos 7 dias',S.habits.length?`<div class="li"><span class="g"></span><div class="dl">${L.map(d=>`<span>${DS[d.getDay()]}</span>`).join('')}</div><span style="width:48px"></span><span style="width:34px"></span></div>`+S.habits.map(h=>`<div class="li"><b class="g">${e(h.name)}</b><div class="dots">${L.map(d=>`<button class="dot ${h.log[ymd(d)]?'on':''}" onclick="A.tg('${h.id}','${ymd(d)}')"></button>`).join('')}</div><span style="width:48px">🔥 ${streak(h)}</span>${dx('habits',h.id)}</div>`).join(''):em('Que hábitos você quer cultivar?'))};
V.fin=()=>{const key=fm.y+'-'+pad(fm.m+1),L=S.tx.filter(x=>x.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date)),inc=sum(L,'Receita'),exp=sum(L,'Despesa'),byc={};
L.filter(x=>x.type=='Despesa').forEach(x=>byc[x.cat]=(byc[x.cat]||0)+x.val);const it=Object.entries(byc).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
const ms=[];for(let i=5;i>=0;i--){const d=new Date(fm.y,fm.m-i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1),l=S.tx.filter(x=>x.date.startsWith(k));ms.push({l:MES[d.getMonth()].slice(0,3),v:[sum(l,'Receita'),sum(l,'Despesa')],c:['var(--m)','#e9b8ae']})}
return head('Finanças','tx','Lançamento')+`<div class="row" style="justify-content:flex-start;margin-bottom:14px"><button class="ghost" onclick="A.mv(fm,-1)">‹</button><b>${MES[fm.m]} ${fm.y}</b><button class="ghost" onclick="A.mv(fm,1)">›</button></div>
<div class="stats"><div class="stat"><span>Receitas</span><b style="font-size:20px">${money(inc)}</b></div><div class="stat"><span>Despesas</span><b style="font-size:20px">${money(exp)}</b></div><div class="stat"><span>Saldo</span><b style="font-size:20px">${money(inc-exp)}</b></div></div>
<div class="grid" style="margin-bottom:18px">${card('Despesas por categoria',donut(it))}${card('Receitas × despesas',bars(ms,Math.max(1,...ms.flatMap(m=>m.v)))+'<small>verde: receitas · rosa: despesas</small>')}</div>
${card('Lançamentos',L.map(x=>`<div class="li"><small>${x.date.split('-').reverse().slice(0,2).join('/')}</small><span class="g">${e(x.desc)} <span class="chip">${e(x.cat)}</span></span><b class="${x.type=='Receita'?'pos':'neg'}">${x.type=='Receita'?'+':'−'}${money(x.val)}</b>${dx('tx',x.id)}</div>`).join('')||em('Sem lançamentos neste mês.'))}`};
V.wish=()=>{const o={Alta:0,'Média':1,Baixa:2},L=[...S.wish].sort((a,b)=>(a.st=='Comprado')-(b.st=='Comprado')||o[a.pri]-o[b.pri]),tot=S.wish.filter(x=>x.st!='Comprado').reduce((a,x)=>a+x.price,0);
return head('Wishlist','wish','Novo desejo')+`<p class="mut">Total a conquistar: <b>${money(tot)}</b></p><div class="grid">${L.map(x=>card(`<span class="${x.st=='Comprado'?'done':''}">${e(x.name)}</span>`,`<div class="between"><b>${money(x.price)}</b><span class="chip ${x.pri}">${x.pri}</span></div><select onchange="A.ws('${x.id}',this.value)">${['Quero','Pesquisando','Comprado'].map(s=>`<option ${s==x.st?'selected':''}>${s}</option>`).join('')}</select><div class="row"><button class="ghost" onclick="A.edit('wish','${x.id}')">Editar</button>${dx('wish',x.id)}</div>`)).join('')||em('O que está na sua lista de desejos? 🛍️')}</div>`};
V.proj=()=>head('Projetos pessoais','proj','Novo projeto')+`<div class="kan">${PH.map(p=>card(p,S.proj.filter(x=>x.st==p).map(x=>card(e(x.name),`<p class="mut">${e(x.desc)}</p>${bar(x.pg)}<input type="range" min="0" max="100" value="${x.pg}" oninput="A.pp('${x.id}',this.value)" onchange="render()"><select onchange="A.ps('${x.id}',this.value)">${PH.map(s=>`<option ${s==x.st?'selected':''}>${s}</option>`).join('')}</select><div class="row"><button class="ghost" onclick="A.edit('proj','${x.id}')">Editar</button>${dx('proj',x.id)}</div>`)).join('')||em('—'))).join('')}</div>`;
V.cal=()=>{const first=new Date(cm.y,cm.m,1).getDay(),n=new Date(cm.y,cm.m+1,0).getDate(),t=today(),cells=[];for(let i=0;i<first;i++)cells.push('<div class="day o"></div>');
for(let d=1;d<=n;d++){const ds=cm.y+'-'+pad(cm.m+1)+'-'+pad(d);cells.push(`<div class="day ${ds==t?'t':''}" onclick="A.add('ev',{date:'${ds}'})"><b>${d}</b>${S.ev.filter(x=>x.date==ds).map(x=>`<span class="ev">${e(x.time)} ${e(x.title)}</span>`).join('')}</div>`)}
const key=cm.y+'-'+pad(cm.m+1),L=S.ev.filter(x=>x.date.startsWith(key)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
return head('Calendário','ev','Evento')+`<div class="row" style="justify-content:flex-start;margin-bottom:14px"><button class="ghost" onclick="A.mv(cm,-1)">‹</button><b>${MES[cm.m]} ${cm.y}</b><button class="ghost" onclick="A.mv(cm,1)">›</button></div>${card('',`<div class="cal">${DS.map(d=>`<b>${d}</b>`).join('')}${cells.join('')}</div>`)}<div style="height:18px"></div>${card('Eventos do mês',L.map(x=>`<div class="li"><small>${x.date.split('-').reverse().slice(0,2).join('/')} ${e(x.time)}</small><span class="g">${e(x.title)}</span>${dx('ev',x.id)}</div>`).join('')||em('Toque em um dia para adicionar um evento.'))}`};
V.mom=()=>head('Momentos importantes','mom','Novo momento')+`<div class="mas">${[...S.mom].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>card(`${e(x.mood)} ${e(x.title)}`,`<small>${x.date.split('-').reverse().join('/')}</small><p style="white-space:pre-wrap">${e(x.text)}</p><div class="row"><button class="ghost" onclick="A.edit('mom','${x.id}')">Editar</button>${dx('mom',x.id)}</div>`)).join('')||em('Guarde aqui as memórias que você quer reviver. ✨')}</div>`;
V.books=()=>{const r=S.books.filter(b=>b.stars>0),avg=r.length?(r.reduce((a,b)=>a+b.stars,0)/r.length).toFixed(1):'—';
return head('Leituras','books','Novo livro')+`<p class="mut">${S.books.length} livro(s) · média de estrelas: <b>${avg}</b></p><div class="books">${S.books.map(b=>`<div><div onclick="A.edit('books','${b.id}')">${cover(b.id)?`<img class="bk" src="${cover(b.id)}" alt="Capa de ${e(b.title)}">`:`<div class="bk ph">${e(b.title)}</div>`}</div><div style="margin-top:8px"><b>${e(b.title)}</b><br><small>${e(b.author)}</small>${stars(b.stars,i=>`A.bs('${b.id}',${i})`)}${dx('books',b.id)}</div></div>`).join('')||em('Sua estante está vazia. Adicione o primeiro livro! 📚')}</div>`};
const NAV=[['home','Início','🏡'],['goals','Metas','🎯'],['tasks','Tarefas','✅'],['habits','Hábitos','🌱'],['fin','Finanças','💰'],['wish','Wishlist','🛍️'],['proj','Projetos','🗂️'],['cal','Calendário','📅'],['mom','Momentos','✨'],['books','Leituras','📚']];
function render(){document.getElementById('nav').innerHTML=`<div class="brand"><span contenteditable="true" spellcheck="false" onblur="S.name=this.textContent.trim()||'Meu Painel';document.title=S.name;save()">${e(S.name)}</span><small>toque no nome para renomear</small></div>`+NAV.map(n=>`<button class="nv ${view==n[0]?'on':''}" onclick="view='${n[0]}';render()">${n[2]} ${n[1]}</button>`).join('');document.getElementById('main').innerHTML=V[view]();document.title=S.name}
render();
</script></body></html>
